services:
  db:
    image: postgres:16-alpine
    container_name: equipment-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_dev_password
      POSTGRES_DB: equipment_rental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d equipment_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
